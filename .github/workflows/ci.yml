name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify Booking API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build TypeScript
        run: pnpm build

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker image
        run: docker build -t booking-system:${{ github.sha }} .

  deploy:
    name: Deploy to AWS EC2
    needs: verify

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: booking-system-production-deploy
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy to production through SSM
        shell: bash
        run: |
          set -euo pipefail

          cat > ssm-parameters.json <<'EOF'
          {
            "commands": [
              "set -euo pipefail",
              "APP_DIR=/home/ubuntu/node-project-1",
              "PREVIOUS_COMMIT=$(sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/node-project-1 && git rev-parse HEAD')",
              "echo Previous commit: $PREVIOUS_COMMIT",
              "sudo -u ubuntu -H bash -lc 'cd /home/ubuntu/node-project-1 && git fetch origin main && git reset --hard origin/main'",
              "sudo -u ubuntu -H bash -lc \"cd /home/ubuntu/node-project-1 && PREVIOUS_COMMIT=$PREVIOUS_COMMIT bash scripts/deploy-production.sh\""
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy booking system $GITHUB_SHA" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          sleep 3

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "SSM deployment command completed successfully."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with SSM status: $STATUS"

                aws ssm get-command-invocation \
                  --region eu-north-1 \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query "{
                    Status: Status,
                    Output: StandardOutputContent,
                    Error: StandardErrorContent
                  }" \
                  --output json

                exit 1
                ;;

              Pending|InProgress|Delayed)
                ;;

              *)
                echo "Unknown SSM status: $STATUS"
                ;;
            esac

            sleep 5
          done

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          if [ "$FINAL_STATUS" != "Success" ]; then
            echo "Deployment did not complete successfully."
            echo "Final SSM status: $FINAL_STATUS"

            aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "{
                Status: Status,
                Output: StandardOutputContent,
                Error: StandardErrorContent
              }" \
              --output json

            exit 1
          fi

          echo "Deployment completed successfully."

          aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "{
              Status: Status,
              Output: StandardOutputContent
            }" \
            --output json