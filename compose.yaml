x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: "0.75"
    pids_limit: 200
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    mem_limit: 96m
    cpus: "0.25"
    pids_limit: 100
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 320m
    cpus: "0.75"
    pids_limit: 300
    logging: *default-logging

  migrate:
    build: .
    env_file:
      - .env
    command:
      ["pnpm", "exec", "sequelize-cli", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 100
    logging: *default-logging

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    command: ["node", "dist/server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 150

    init: true
    stop_grace_period: 15s

    logging: *default-logging

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["node", "dist/workers/booking-confirmed.worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    mem_limit: 192m
    cpus: "0.50"
    pids_limit: 150

    init: true
    stop_grace_period: 15s

    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 96m
    cpus: "0.25"
    pids_limit: 100

    logging: *default-logging

volumes:
  postgres_data:
  rabbitmq_data:
  caddy_data:
  caddy_config: